name: Build and Push

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions: read-all

env:
  REGISTRY: quay.io
  IMAGE_NAME: bapalm/tls-compliance-operator

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  build-plugin:
    name: Build Plugin Binaries
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          OUTPUT="kubectl-tlsreport-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags "-X main.version=${VERSION}" -o "${OUTPUT}" ./cmd/kubectl-tlsreport
          hack/package-plugin.sh "${OUTPUT}" "${OUTPUT}.tar.gz"

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY="kubectl-tlsreport-${{ matrix.goos }}-${{ matrix.goarch }}"
          gh release upload ${{ github.event.release.tag_name }} "${BINARY}" "${BINARY}.tar.gz" --clobber

  krew-manifest:
    name: Generate Krew Manifest
    needs: build-plugin
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download plugin archives from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p /tmp/krew
          gh release download "$TAG" -R "${{ github.repository }}" \
            --dir /tmp/krew -p "kubectl-tlsreport-*.tar.gz"

      - name: Generate and upload Krew manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          hack/generate-krew-manifest.sh \
            --version "$TAG" \
            --archive-dir /tmp/krew \
            --output /tmp/tlsreport.yaml
          gh release upload "$TAG" /tmp/tlsreport.yaml --clobber

  build-and-push:
    name: Build and Push Multi-Arch Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for uploading release assets
      packages: write
      id-token: write  # Required for cosign keyless signing with GitHub OIDC

    steps:
      - name: Check Red Hat Status
        uses: palmsoftware/redhat-status@v0
        with:
          components: |
            Quay.io

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Unstable tag: overwritten on every push to main
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}
            # Latest tag: points to the most recent release
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # Version tags for releases (v0.1.0, v0.1, v0)
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'release' }}

      - name: Build and push multi-arch image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image with cosign
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign the image by digest for each tag
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Verify container image signature
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}

      - name: Generate SBOM
        if: github.event_name == 'release'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} sbom.spdx.json --clobber

      - name: Generate install manifest
        if: github.event_name == 'release'
        run: |
          make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}

      - name: Upload install manifest to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/install.yaml --clobber

      - name: Add install instructions to release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          EXISTING_BODY=$(gh release view "$TAG" --json body --jq '.body')
          read -r -d '' INSTALL_SECTION << SECTION || true
          ## Quick Install

          \`\`\`bash
          kubectl apply -f https://github.com/${REPO}/releases/download/${TAG}/install.yaml
          \`\`\`

          To uninstall:

          \`\`\`bash
          kubectl delete -f https://github.com/${REPO}/releases/download/${TAG}/install.yaml
          \`\`\`

          ## kubectl Plugin

          \`\`\`bash
          # Krew (linux/darwin amd64 and arm64)
          kubectl krew install --manifest-url https://github.com/${REPO}/releases/download/${TAG}/tlsreport.yaml

          # Linux (amd64)
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/kubectl-tlsreport-linux-amd64
          chmod +x kubectl-tlsreport-linux-amd64
          sudo mv kubectl-tlsreport-linux-amd64 /usr/local/bin/kubectl-tlsreport

          # macOS (Apple Silicon)
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/kubectl-tlsreport-darwin-arm64
          chmod +x kubectl-tlsreport-darwin-arm64
          sudo mv kubectl-tlsreport-darwin-arm64 /usr/local/bin/kubectl-tlsreport
          \`\`\`
          SECTION
          INSTALL_SECTION=$(echo "$INSTALL_SECTION" | sed 's/^          //')
          printf '%s\n\n%s' "$INSTALL_SECTION" "$EXISTING_BODY" > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md
