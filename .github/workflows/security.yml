name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run govulncheck
        run: |
          govulncheck ./... 2>&1 | tee /tmp/govulncheck-output.txt && exit 0
          if [ -f .govulncheckignore ]; then
            IGNORED=$(grep -v '^#' .govulncheckignore | grep -v '^$' || true)
            if [ -n "$IGNORED" ]; then
              NON_IGNORED=$(grep -oP 'GO-\d{4}-\d+' /tmp/govulncheck-output.txt | sort -u | while read id; do
                grep -qx "$id" .govulncheckignore || echo "$id"
              done)
              if [ -z "$NON_IGNORED" ]; then
                echo "All govulncheck findings are in .govulncheckignore"
                exit 0
              fi
            fi
          fi
          echo "::error::govulncheck found non-ignored vulnerabilities"
          exit 1

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Build image for scanning
        run: make docker-build IMG=tls-compliance-operator:scan
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tls-compliance-operator:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
