---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-security-telco-openshift-io-v1alpha1-tlscompliancetarget
  failurePolicy: Fail
  name: vtlscompliancetarget.kb.io
  rules:
  - apiGroups:
    - security.telco.openshift.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tlscompliancetargets
  sideEffects: None
