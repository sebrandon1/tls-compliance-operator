  selector:
    matchLabels:
      app.kubernetes.io/name: tls-compliance-operator
      control-plane: controller-manager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tls-compliance-operator
    control-plane: controller-manager
  name: tls-compliance-operator-controller-manager
  namespace: tls-compliance-operator-system
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  - {}
  ingress:
  - ports:
    - port: 8443
      protocol: TCP
  - ports:
    - port: 8081
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tls-compliance-operator
      control-plane: controller-manager
  policyTypes:
  - Ingress
  - Egress
