# Apply to the Konflux cluster: oc apply -f integration-test-scenario.yaml
# Not watched by Konflux from git -- see konflux/README.md.
#
# To validate this on a feature/PR branch before merging, temporarily change
# spec.resolverRef.params[revision] below to the branch name, re-apply, then
# open/update the PR. Switch it back to `main` before merging.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: tls-compliance-operator-self-test
  namespace: ocp-isc-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: tls-compliance-operator
  contexts:
    - description: Smoke + TLS fixture + run-once scan against the just-built operator image.
      name: application
  resolverRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/sebrandon1/tls-compliance-operator.git
      # TEMP: point at the feature branch for PR validation. Change back to main before merge.
      - name: revision
        value: main
      - name: pathInRepo
        value: konflux/pipelines/tls-compliance-self-test.yaml
  params:
    - name: COMPONENT_NAME
      value: tls-compliance-operator
---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: tls-compliance-operator-smoke-test
  namespace: ocp-isc-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: tls-compliance-operator
  contexts:
    - description: Confirm the operator image is runnable.
      name: application
  resolverRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/sebrandon1/tls-compliance-operator.git
      # TEMP: point at the feature branch for PR validation. Change back to main before merge.
      - name: revision
        value: main
      - name: pathInRepo
        value: konflux/pipelines/tls-compliance-smoke-test.yaml
  params:
    - name: COMPONENT_NAME
      value: tls-compliance-operator
