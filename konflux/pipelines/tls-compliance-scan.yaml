# Fetched at run time by Konflux via a layered product's IntegrationTestScenario
# git resolver (not applied to the cluster directly). See konflux/README.md
# "Using tls-compliance-operator from a layered product".
#
# Deploys the tls-compliance-operator as a run-once Job into a target cluster
# (kubeconfig from TARGET_KUBECONFIG_SECRET), waits for completion, collects
# artifacts, and emits the standardized TEST_OUTPUT result the Integration
# Service uses for GitHub PR checks.
#
# Pin resolverRef.revision to a release tag or known-good commit -- do not track
# main unless you intentionally want breaking pipeline changes.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tls-compliance-scan
  labels:
    app.kubernetes.io/name: tls-compliance-scan
    app.kubernetes.io/part-of: tls-compliance-operator
spec:
  description: |
    Deploy tls-compliance-operator as a run-once Job against a target environment
    and report TLS/PQC compliance via TEST_OUTPUT. Layered products supply a
    kubeconfig Secret for their ephemeral test cluster and optional scan filters.
  params:
    - name: SNAPSHOT
      description: Snapshot of the application under test, injected by Konflux.
      type: string
      default: '{"components":[]}'
    - name: COMPONENT_NAME
      description: Name of the tls-compliance-operator component in SNAPSHOT when SCANNER_IMAGE is empty.
      type: string
      default: tls-compliance-operator
    - name: SCANNER_IMAGE
      description: >
        Full tls-compliance-operator image reference. When empty, resolved from
        SNAPSHOT using COMPONENT_NAME. Layered products should usually pin a
        released tag.
      type: string
      default: ""
    - name: TARGET_KUBECONFIG_SECRET
      description: Name of a Secret in the PipelineRun namespace holding the target kubeconfig.
      type: string
    - name: TARGET_KUBECONFIG_SECRET_KEY
      description: Key within TARGET_KUBECONFIG_SECRET that contains the kubeconfig.
      type: string
      default: kubeconfig
    - name: SCAN_NAMESPACE
      description: Namespace in the target cluster where the scanner Job and CRDs are deployed.
      type: string
      default: tls-compliance-operator
    - name: INCLUDE_NAMESPACES
      description: Comma-separated namespaces to scan. Empty means scan all endpoints.
      type: string
      default: ""
    - name: EXCLUDE_NAMESPACES
      description: Comma-separated namespaces to exclude from scanning.
      type: string
      default: ""
    - name: OUTPUT_FORMAT
      description: Output format for scan results (csv, json, yaml, junit, markdown).
      type: string
      default: junit
    - name: WORKERS
      description: Concurrent scan workers.
      type: string
      default: "10"
    - name: JOB_TIMEOUT_SECONDS
      description: Max seconds to wait for the scanner Job to finish.
      type: string
      default: "3600"
  results:
    - name: TEST_OUTPUT
      description: Standardized Konflux test result JSON.
      value: $(tasks.run-scan.results.TEST_OUTPUT)
  tasks:
    - name: resolve-image
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
        - name: SCANNER_IMAGE
          value: $(params.SCANNER_IMAGE)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: COMPONENT_NAME
          - name: SCANNER_IMAGE
        results:
          - name: SCANNER_IMAGE
            description: Resolved tls-compliance-operator container image.
        steps:
          - name: resolve
            image: quay.io/konflux-ci/konflux-test:stable
            script: |
              #!/bin/bash
              set -euo pipefail
              override="$(params.SCANNER_IMAGE)"
              if [[ -n "${override}" ]]; then
                echo -n "${override}" | tee "$(results.SCANNER_IMAGE.path)"
                exit 0
              fi
              image=$(jq -r --arg name "$(params.COMPONENT_NAME)" \
                '.components[]? | select(.name == $name) | .containerImage' \
                <<< "$(params.SNAPSHOT)" | head -n1)
              if [[ -z "${image}" || "${image}" == "null" ]]; then
                echo "SCANNER_IMAGE empty and no containerImage for component $(params.COMPONENT_NAME) in SNAPSHOT" >&2
                exit 1
              fi
              echo -n "${image}" | tee "$(results.SCANNER_IMAGE.path)"

    - name: run-scan
      runAfter:
        - resolve-image
      params:
        - name: SCANNER_IMAGE
          value: $(tasks.resolve-image.results.SCANNER_IMAGE)
        - name: TARGET_KUBECONFIG_SECRET
          value: $(params.TARGET_KUBECONFIG_SECRET)
        - name: TARGET_KUBECONFIG_SECRET_KEY
          value: $(params.TARGET_KUBECONFIG_SECRET_KEY)
        - name: SCAN_NAMESPACE
          value: $(params.SCAN_NAMESPACE)
        - name: INCLUDE_NAMESPACES
          value: $(params.INCLUDE_NAMESPACES)
        - name: EXCLUDE_NAMESPACES
          value: $(params.EXCLUDE_NAMESPACES)
        - name: OUTPUT_FORMAT
          value: $(params.OUTPUT_FORMAT)
        - name: WORKERS
          value: $(params.WORKERS)
        - name: JOB_TIMEOUT_SECONDS
          value: $(params.JOB_TIMEOUT_SECONDS)
      taskSpec:
        params:
          - name: SCANNER_IMAGE
          - name: TARGET_KUBECONFIG_SECRET
          - name: TARGET_KUBECONFIG_SECRET_KEY
          - name: SCAN_NAMESPACE
          - name: INCLUDE_NAMESPACES
          - name: EXCLUDE_NAMESPACES
          - name: OUTPUT_FORMAT
          - name: WORKERS
          - name: JOB_TIMEOUT_SECONDS
        results:
          - name: TEST_OUTPUT
            description: Standardized Konflux test result.
        steps:
          - name: deploy-wait-collect
            image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: SCANNER_IMAGE
                value: $(params.SCANNER_IMAGE)
              - name: TARGET_KUBECONFIG_SECRET
                value: $(params.TARGET_KUBECONFIG_SECRET)
              - name: TARGET_KUBECONFIG_SECRET_KEY
                value: $(params.TARGET_KUBECONFIG_SECRET_KEY)
              - name: SCAN_NAMESPACE
                value: $(params.SCAN_NAMESPACE)
              - name: INCLUDE_NAMESPACES
                value: $(params.INCLUDE_NAMESPACES)
              - name: EXCLUDE_NAMESPACES
                value: $(params.EXCLUDE_NAMESPACES)
              - name: OUTPUT_FORMAT
                value: $(params.OUTPUT_FORMAT)
              - name: WORKERS
                value: $(params.WORKERS)
              - name: JOB_TIMEOUT_SECONDS
                value: $(params.JOB_TIMEOUT_SECONDS)
            script: |
              #!/bin/bash
              set -uo pipefail

              write_test_output() {
                local result="$1"
                local note="$2"
                local TEST_OUTPUT
                TEST_OUTPUT=$(jq -rc -n \
                  --arg date "$(date -u --iso-8601=seconds)" \
                  --arg result "${result}" \
                  --arg note "${note}" \
                  '{result: $result, timestamp: $date, note: $note, failures: (if $result == "SUCCESS" then 0 else 1 end), successes: (if $result == "SUCCESS" then 1 else 0 end), warnings: 0}')
                echo -n "${TEST_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
              }

              ARTIFACTS=/tmp/tco-artifacts
              mkdir -p "${ARTIFACTS}"

              # --- Read kubeconfig from Secret ---
              ns="${NAMESPACE:-$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)}"
              if ! oc get secret "${TARGET_KUBECONFIG_SECRET}" -n "${ns}" \
                  -o "jsonpath={.data.${TARGET_KUBECONFIG_SECRET_KEY}}" | base64 -d > /tmp/kubeconfig; then
                write_test_output "ERROR" "failed to read kubeconfig secret ${TARGET_KUBECONFIG_SECRET}"
                exit 1
              fi
              export KUBECONFIG=/tmp/kubeconfig
              chmod 600 "${KUBECONFIG}"

              JOB_NAME="tco-compliance-job"
              SA_NAME="tco-scanner"

              cleanup() {
                oc delete job "${JOB_NAME}" -n "${SCAN_NAMESPACE}" --ignore-not-found=true 2>/dev/null || true
                oc delete clusterrolebinding "tco-scanner-binding" --ignore-not-found=true 2>/dev/null || true
                oc delete clusterrole "tco-scanner-role" --ignore-not-found=true 2>/dev/null || true
              }
              trap cleanup EXIT

              # --- Create namespace and SA ---
              oc get ns "${SCAN_NAMESPACE}" >/dev/null 2>&1 || oc create ns "${SCAN_NAMESPACE}"
              oc get sa "${SA_NAME}" -n "${SCAN_NAMESPACE}" >/dev/null 2>&1 || oc create sa "${SA_NAME}" -n "${SCAN_NAMESPACE}"

              # --- Install CRDs ---
              echo "=== Installing CRDs ==="
              cat <<'CRD_EOF' | oc apply -f -
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: tlscompliancereports.security.telco.openshift.io
              spec:
                group: security.telco.openshift.io
                names:
                  kind: TLSComplianceReport
                  listKind: TLSComplianceReportList
                  plural: tlscompliancereports
                  singular: tlscompliancereport
                  shortNames:
                    - tlsreport
                scope: Cluster
                versions:
                  - name: v1alpha1
                    served: true
                    storage: true
                    schema:
                      openAPIV3Schema:
                        type: object
                        properties:
                          spec:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          status:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    subresources:
                      status: {}
              ---
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: tlscompliancetargets.security.telco.openshift.io
              spec:
                group: security.telco.openshift.io
                names:
                  kind: TLSComplianceTarget
                  listKind: TLSComplianceTargetList
                  plural: tlscompliancetargets
                  singular: tlscompliancetarget
                scope: Cluster
                versions:
                  - name: v1alpha1
                    served: true
                    storage: true
                    schema:
                      openAPIV3Schema:
                        type: object
                        properties:
                          spec:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          status:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    subresources:
                      status: {}
              CRD_EOF

              # --- Create RBAC ---
              echo "=== Creating RBAC ==="
              cat <<'RBAC_EOF' | oc apply -f -
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: tco-scanner-role
              rules:
                - apiGroups: [""]
                  resources: [pods, services]
                  verbs: [get, list, watch]
                - apiGroups: [""]
                  resources: [events]
                  verbs: [create, patch]
                - apiGroups: [discovery.k8s.io]
                  resources: [endpointslices]
                  verbs: [get, list, watch]
                - apiGroups: [networking.k8s.io]
                  resources: [ingresses]
                  verbs: [get, list, watch]
                - apiGroups: [route.openshift.io]
                  resources: [routes]
                  verbs: [get, list, watch]
                - apiGroups: [config.openshift.io]
                  resources: [apiservers]
                  verbs: [get, list, watch]
                - apiGroups: [operator.openshift.io]
                  resources: [ingresscontrollers]
                  verbs: [get, list, watch]
                - apiGroups: [machineconfiguration.openshift.io]
                  resources: [kubeletconfigs]
                  verbs: [get, list, watch]
                - apiGroups: [gateway.networking.k8s.io]
                  resources: [gateways, httproutes, tlsroutes]
                  verbs: [get, list, watch]
                - apiGroups: [security.telco.openshift.io]
                  resources: [tlscompliancereports, tlscompliancereports/status, tlscompliancereports/finalizers]
                  verbs: [get, list, watch, create, update, patch, delete]
                - apiGroups: [security.telco.openshift.io]
                  resources: [tlscompliancetargets, tlscompliancetargets/status]
                  verbs: [get, list, watch]
              RBAC_EOF

              cat <<BINDING_EOF | oc apply -f -
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: tco-scanner-binding
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: tco-scanner-role
              subjects:
                - kind: ServiceAccount
                  name: ${SA_NAME}
                  namespace: ${SCAN_NAMESPACE}
              BINDING_EOF

              # --- Build Job args ---
              EXTRA_ARGS=""
              if [[ -n "${INCLUDE_NAMESPACES}" ]]; then
                EXTRA_ARGS+=" --include-namespaces=${INCLUDE_NAMESPACES}"
              fi
              if [[ -n "${EXCLUDE_NAMESPACES}" ]]; then
                EXTRA_ARGS+=" --exclude-namespaces=${EXCLUDE_NAMESPACES}"
              fi

              # --- Deploy run-once Job ---
              echo "=== Deploying run-once scan Job ==="
              SCANNER_IMAGE="${SCANNER_IMAGE}" SCAN_NAMESPACE="${SCAN_NAMESPACE}" \
              JOB_NAME="${JOB_NAME}" SA_NAME="${SA_NAME}" WORKERS="${WORKERS}" \
              OUTPUT_FORMAT="${OUTPUT_FORMAT}" EXTRA_ARGS="${EXTRA_ARGS}" python3 - <<'PY'
              import json, os
              extra = os.environ.get("EXTRA_ARGS", "").strip()
              args = [
                "--run-once",
                f"--output-format={os.environ['OUTPUT_FORMAT']}",
                "--output-file=/results/report.xml",
                f"--workers={os.environ['WORKERS']}",
              ]
              if extra:
                args.extend(extra.split())
              job = {
                "apiVersion": "batch/v1",
                "kind": "Job",
                "metadata": {
                  "name": os.environ["JOB_NAME"],
                  "namespace": os.environ["SCAN_NAMESPACE"],
                },
                "spec": {
                  "backoffLimit": 0,
                  "template": {
                    "spec": {
                      "serviceAccountName": os.environ["SA_NAME"],
                      "restartPolicy": "Never",
                      "containers": [{
                        "name": "tco",
                        "image": os.environ["SCANNER_IMAGE"],
                        "imagePullPolicy": "Always",
                        "args": args,
                        "volumeMounts": [{"name": "results", "mountPath": "/results"}],
                      }],
                      "volumes": [{"name": "results", "emptyDir": {}}],
                    }
                  },
                },
              }
              open("/tmp/tco-job.json", "w").write(json.dumps(job))
              PY
              oc apply -f /tmp/tco-job.json

              # --- Wait for Job ---
              echo "Waiting for scan Job (timeout ${JOB_TIMEOUT_SECONDS}s)..."
              deadline=$(( $(date +%s) + JOB_TIMEOUT_SECONDS ))
              while true; do
                if oc wait --for=condition=complete job/"${JOB_NAME}" -n "${SCAN_NAMESPACE}" --timeout=10s 2>/dev/null; then
                  break
                fi
                failed=$(oc get job "${JOB_NAME}" -n "${SCAN_NAMESPACE}" -o jsonpath='{.status.failed}' 2>/dev/null || echo "0")
                if [[ "${failed}" -gt 0 ]]; then
                  echo "=== Job failed ==="
                  POD=$(oc get pods -n "${SCAN_NAMESPACE}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                  if [[ -n "${POD}" ]]; then
                    oc logs "${POD}" -n "${SCAN_NAMESPACE}" 2>/dev/null || true
                  fi
                  # Exit code 1 from the operator means non-compliant endpoints found
                  write_test_output "FAILURE" "tls-compliance-operator found non-compliant endpoints"
                  exit 1
                fi
                if [[ $(date +%s) -ge ${deadline} ]]; then
                  write_test_output "ERROR" "timed out waiting for scan Job"
                  exit 1
                fi
                sleep 10
              done

              # --- Collect artifacts ---
              POD=$(oc get pods -n "${SCAN_NAMESPACE}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
              if [[ -n "${POD}" ]]; then
                oc cp "${SCAN_NAMESPACE}/${POD}:/results/report.xml" "${ARTIFACTS}/report.xml" 2>/dev/null || true
                echo "=== Job logs (tail) ==="
                oc logs "${POD}" -n "${SCAN_NAMESPACE}" --tail=100 2>/dev/null || true
              fi

              if [[ -f "${ARTIFACTS}/report.xml" ]]; then
                echo "=== Scan report ==="
                cat "${ARTIFACTS}/report.xml"
              fi

              write_test_output "SUCCESS" "tls-compliance-operator scan completed successfully"
              exit 0
