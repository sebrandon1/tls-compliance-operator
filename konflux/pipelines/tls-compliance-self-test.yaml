# Fetched at run time by this repo's IntegrationTestScenario git resolver.
# Not applied to the cluster directly. See konflux/README.md.
#
# End-to-end self-test for a tls-compliance-operator Snapshot build:
#   1) resolve the just-built image from SNAPSHOT
#   2) smoke-check --help
#   3) deploy a short-lived TLS fixture pod in the PipelineRun namespace
#   4) install CRDs + RBAC
#   5) deploy the operator as a Job with --run-once
#   6) emit standardized TEST_OUTPUT
#
# Requires the PipelineRun SA to create pods/jobs/CRDs/RBAC in its namespace.
# Marked optional on the ITS while bootstrapping.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tls-compliance-self-test
  labels:
    app.kubernetes.io/name: tls-compliance-self-test
    app.kubernetes.io/part-of: tls-compliance-operator
spec:
  description: Self-test a tls-compliance-operator Snapshot with a local TLS fixture and run-once scan.
  params:
    - name: SNAPSHOT
      description: Snapshot of the application under test, injected by Konflux.
      type: string
    - name: COMPONENT_NAME
      description: Name of the tls-compliance-operator component in SNAPSHOT.
      type: string
      default: tls-compliance-operator
  results:
    - name: TEST_OUTPUT
      description: Standardized Konflux test result JSON.
      value: $(tasks.self-test.results.TEST_OUTPUT)
  tasks:
    - name: self-test
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: COMPONENT_NAME
        results:
          - name: TEST_OUTPUT
            description: Standardized Konflux test result.
        steps:
          - name: run-self-test
            image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: COMPONENT_NAME
                value: $(params.COMPONENT_NAME)
            script: |
              #!/bin/bash
              set -uo pipefail

              write_test_output() {
                local result="$1"
                local note="$2"
                local TEST_OUTPUT
                TEST_OUTPUT=$(jq -rc -n \
                  --arg date "$(date -u --iso-8601=seconds)" \
                  --arg result "${result}" \
                  --arg note "${note}" \
                  '{result: $result, timestamp: $date, note: $note, failures: (if $result == "SUCCESS" then 0 else 1 end), successes: (if $result == "SUCCESS" then 1 else 0 end), warnings: 0}')
                echo -n "${TEST_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
              }

              SCANNER_IMAGE=$(jq -r --arg name "${COMPONENT_NAME}" \
                '.components[]? | select(.name == $name) | .containerImage' \
                <<< "${SNAPSHOT}" | head -n1)
              if [[ -z "${SCANNER_IMAGE}" || "${SCANNER_IMAGE}" == "null" ]]; then
                write_test_output "ERROR" "no containerImage for component ${COMPONENT_NAME} in SNAPSHOT"
                exit 1
              fi
              echo "SCANNER_IMAGE=${SCANNER_IMAGE}"

              # --- Smoke: image is runnable ---
              echo "=== Smoke test: --help ==="
              if ! oc run tco-smoke --rm -i --restart=Never --image="${SCANNER_IMAGE}" \
                  --command -- /manager --help 2>&1; then
                write_test_output "FAILURE" "tls-compliance-operator --help failed in smoke pod"
                exit 1
              fi
              echo "Smoke test passed."

              # --- Setup ---
              ns=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              export ns
              FIXTURE_NAME="tls-test-fixture"
              JOB_NAME="tco-selftest-job"
              SA_NAME="tco-selftest"
              ARTIFACTS=/tmp/tco-artifacts
              mkdir -p "${ARTIFACTS}"

              cleanup() {
                oc delete job "${JOB_NAME}" -n "${ns}" --ignore-not-found=true 2>/dev/null || true
                oc delete pod "${FIXTURE_NAME}" -n "${ns}" --ignore-not-found=true 2>/dev/null || true
                oc delete clusterrolebinding "tco-selftest-binding" --ignore-not-found=true 2>/dev/null || true
                oc delete clusterrole "tco-selftest-role" --ignore-not-found=true 2>/dev/null || true
                oc delete crd tlscompliancereports.security.telco.openshift.io --ignore-not-found=true 2>/dev/null || true
                oc delete crd tlscompliancetargets.security.telco.openshift.io --ignore-not-found=true 2>/dev/null || true
              }
              trap cleanup EXIT

              # --- Deploy TLS fixture pod ---
              echo "=== Deploying TLS fixture pod ==="
              cat <<FIXTURE_EOF | oc apply -f -
              apiVersion: v1
              kind: Pod
              metadata:
                name: ${FIXTURE_NAME}
                namespace: ${ns}
                labels:
                  app: tls-test-fixture
              spec:
                containers:
                  - name: tls-server
                    image: quay.io/bapalm/tls-test-server:latest
                    ports:
                      - containerPort: 8443
                    env:
                      - name: TLS_MIN_VERSION
                        value: "1.2"
                      - name: TLS_MAX_VERSION
                        value: "1.3"
                restartPolicy: Never
              FIXTURE_EOF

              echo "Waiting for fixture pod to be ready..."
              for i in $(seq 1 60); do
                phase=$(oc get pod "${FIXTURE_NAME}" -n "${ns}" -o jsonpath='{.status.phase}' 2>/dev/null || echo Pending)
                if [[ "${phase}" == "Running" ]]; then
                  break
                fi
                if [[ "${phase}" == "Failed" ]]; then
                  write_test_output "ERROR" "TLS fixture pod failed to start"
                  exit 1
                fi
                sleep 2
              done

              # --- Create a Service for the fixture so the operator discovers it ---
              cat <<SVC_EOF | oc apply -f -
              apiVersion: v1
              kind: Service
              metadata:
                name: tls-test-fixture
                namespace: ${ns}
              spec:
                selector:
                  app: tls-test-fixture
                ports:
                  - port: 8443
                    targetPort: 8443
                    protocol: TCP
              SVC_EOF

              # --- Install CRDs ---
              echo "=== Installing CRDs ==="
              cat <<'CRD_EOF' | oc apply -f -
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: tlscompliancereports.security.telco.openshift.io
              spec:
                group: security.telco.openshift.io
                names:
                  kind: TLSComplianceReport
                  listKind: TLSComplianceReportList
                  plural: tlscompliancereports
                  singular: tlscompliancereport
                  shortNames:
                    - tlsreport
                scope: Cluster
                versions:
                  - name: v1alpha1
                    served: true
                    storage: true
                    schema:
                      openAPIV3Schema:
                        type: object
                        properties:
                          spec:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          status:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    subresources:
                      status: {}
              ---
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: tlscompliancetargets.security.telco.openshift.io
              spec:
                group: security.telco.openshift.io
                names:
                  kind: TLSComplianceTarget
                  listKind: TLSComplianceTargetList
                  plural: tlscompliancetargets
                  singular: tlscompliancetarget
                scope: Cluster
                versions:
                  - name: v1alpha1
                    served: true
                    storage: true
                    schema:
                      openAPIV3Schema:
                        type: object
                        properties:
                          spec:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          status:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    subresources:
                      status: {}
              CRD_EOF

              # --- Create RBAC ---
              echo "=== Creating RBAC ==="
              oc get sa "${SA_NAME}" -n "${ns}" >/dev/null 2>&1 || oc create sa "${SA_NAME}" -n "${ns}"

              cat <<'RBAC_EOF' | oc apply -f -
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: tco-selftest-role
              rules:
                - apiGroups: [""]
                  resources: [pods, services, events]
                  verbs: [get, list, watch, create, patch]
                - apiGroups: [discovery.k8s.io]
                  resources: [endpointslices]
                  verbs: [get, list, watch]
                - apiGroups: [networking.k8s.io]
                  resources: [ingresses]
                  verbs: [get, list, watch]
                - apiGroups: [route.openshift.io]
                  resources: [routes]
                  verbs: [get, list, watch]
                - apiGroups: [config.openshift.io]
                  resources: [apiservers]
                  verbs: [get, list, watch]
                - apiGroups: [operator.openshift.io]
                  resources: [ingresscontrollers]
                  verbs: [get, list, watch]
                - apiGroups: [machineconfiguration.openshift.io]
                  resources: [kubeletconfigs]
                  verbs: [get, list, watch]
                - apiGroups: [gateway.networking.k8s.io]
                  resources: [gateways, httproutes, tlsroutes, grpcroutes]
                  verbs: [get, list, watch]
                - apiGroups: [security.telco.openshift.io]
                  resources: [tlscompliancereports, tlscompliancereports/status, tlscompliancereports/finalizers, tlscompliancetargets, tlscompliancetargets/status]
                  verbs: [get, list, watch, create, update, patch, delete]
              RBAC_EOF

              cat <<BINDING_EOF | oc apply -f -
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: tco-selftest-binding
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: tco-selftest-role
              subjects:
                - kind: ServiceAccount
                  name: ${SA_NAME}
                  namespace: ${ns}
              BINDING_EOF

              # --- Deploy operator as a run-once Job ---
              echo "=== Deploying run-once scan Job ==="
              cat <<JOB_EOF | oc apply -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ${JOB_NAME}
                namespace: ${ns}
              spec:
                backoffLimit: 0
                template:
                  spec:
                    serviceAccountName: ${SA_NAME}
                    restartPolicy: Never
                    containers:
                      - name: tco
                        image: ${SCANNER_IMAGE}
                        args:
                          - --run-once
                          - --output-format=junit
                          - --output-file=/results/report.xml
                          - --include-namespaces=${ns}
                        volumeMounts:
                          - name: results
                            mountPath: /results
                    volumes:
                      - name: results
                        emptyDir: {}
              JOB_EOF

              # --- Wait for Job to complete ---
              echo "Waiting for scan Job to complete..."
              if ! oc wait --for=condition=complete job/"${JOB_NAME}" -n "${ns}" --timeout=300s 2>/dev/null; then
                failed=$(oc get job "${JOB_NAME}" -n "${ns}" -o jsonpath='{.status.failed}' 2>/dev/null || echo "0")
                if [[ "${failed}" -gt 0 ]]; then
                  echo "=== Job logs ==="
                  POD=$(oc get pods -n "${ns}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                  if [[ -n "${POD}" ]]; then
                    oc logs "${POD}" -n "${ns}" 2>/dev/null || true
                  fi
                  write_test_output "FAILURE" "run-once scan Job failed"
                  exit 1
                fi
                write_test_output "ERROR" "timed out waiting for scan Job"
                exit 1
              fi

              # --- Collect artifacts ---
              POD=$(oc get pods -n "${ns}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
              if [[ -n "${POD}" ]]; then
                oc cp "${ns}/${POD}:/results/report.xml" "${ARTIFACTS}/report.xml" 2>/dev/null || true
                echo "=== Job logs ==="
                oc logs "${POD}" -n "${ns}" 2>/dev/null || true
              fi

              if [[ -f "${ARTIFACTS}/report.xml" ]]; then
                echo "=== JUnit report ==="
                cat "${ARTIFACTS}/report.xml"
              fi

              write_test_output "SUCCESS" "tls-compliance-operator run-once self-test passed"
