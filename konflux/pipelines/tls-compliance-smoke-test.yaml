# Fetched at run time by Konflux via the git resolver configured in
# konflux/integration-test-scenario.yaml (not applied to the cluster directly).
#
# Light smoke test: confirms the just-built tls-compliance-operator image is
# runnable by executing `manager --help` inside it, and reports the standardized
# TEST_OUTPUT result the Integration Service uses to post the PR check.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tls-compliance-smoke-test
spec:
  params:
    - name: SNAPSHOT
      description: Snapshot of the application under test, injected by Konflux.
      type: string
    - name: COMPONENT_NAME
      description: Name of the component under test, injected by Konflux via label.
      type: string
      default: tls-compliance-operator
  results:
    - name: TEST_OUTPUT
      description: Standardized Konflux test result JSON.
      value: $(tasks.smoke-test.results.TEST_OUTPUT)
  tasks:
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: COMPONENT_NAME
        results:
          - name: COMPONENT_IMAGE
            description: containerImage of COMPONENT_NAME extracted from the Snapshot.
        steps:
          - name: extract-image
            image: quay.io/konflux-ci/konflux-test:stable
            script: |
              #!/bin/bash
              set -euo pipefail
              image=$(jq -r --arg name "$(params.COMPONENT_NAME)" \
                '.components[] | select(.name == $name) | .containerImage' \
                <<< "$(params.SNAPSHOT)")
              if [[ -z "${image}" || "${image}" == "null" ]]; then
                echo "no containerImage found for component $(params.COMPONENT_NAME) in Snapshot" >&2
                exit 1
              fi
              echo -n "${image}" | tee "$(results.COMPONENT_IMAGE.path)"
    - name: smoke-test
      runAfter:
        - parse-metadata
      params:
        - name: COMPONENT_IMAGE
          value: $(tasks.parse-metadata.results.COMPONENT_IMAGE)
      taskSpec:
        params:
          - name: COMPONENT_IMAGE
        results:
          - name: TEST_OUTPUT
            description: Standardized Konflux test result.
        steps:
          - name: run-smoke-test
            image: $(params.COMPONENT_IMAGE)
            script: |
              #!/bin/bash
              set -uo pipefail

              write_test_output() {
                local result="$1"
                local note="$2"
                local TEST_OUTPUT
                TEST_OUTPUT=$(jq -rc -n \
                  --arg date "$(date -u --iso-8601=seconds)" \
                  --arg result "${result}" \
                  --arg note "${note}" \
                  '{result: $result, timestamp: $date, note: $note, failures: (if $result == "SUCCESS" then 0 else 1 end), successes: (if $result == "SUCCESS" then 1 else 0 end), warnings: 0}')
                echo -n "${TEST_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
              }

              echo "=== Smoke test: --help ==="
              if /manager --help 2>&1; then
                write_test_output "SUCCESS" "tls-compliance-operator --help exited successfully"
              else
                write_test_output "FAILURE" "tls-compliance-operator --help failed"
                exit 1
              fi
