apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-tls-ingress
  namespace: default
spec:
  tls:
  - hosts:
    - test-app.example.com
  rules:
  - host: test-app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-https
            port:
              number: 443
